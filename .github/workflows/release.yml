name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      version-semver: ${{ steps.calc.outputs.version_semver }}
      version-msix: ${{ steps.calc.outputs.version_msix }}
      tag: ${{ steps.calc.outputs.tag }}
      prerelease: ${{ steps.calc.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: calc
        run: |
          YEAR=$(date +%Y)
          MONTH=$(date +%m)
          PREFIX="${YEAR}.${MONTH}"

          COUNT=$(git tag -l "v${PREFIX}.*" | wc -l)
          NUM=$(printf '%02d' $((COUNT + 1)))
          VERSION="${PREFIX}.${NUM}"

          # Windows MSI/NSIS requires each version component <= 255
          # Map YYYY.MM.xx -> 0.YY.MM.xx
          IFS='.' read -r Y M D <<< "$VERSION"
          SHORT_YEAR="${Y: -2}"
          VERSION_SEMVER="$((10#${SHORT_YEAR})).$((10#${M})).$((10#${D}))"

          # MSIX (Microsoft Store) requires 4 numeric parts, each <= 65535
          # Map YYYY.MM.xx -> YYYY.M.xx.0 (monotonic across months/years)
          VERSION_MSIX="$((10#${Y})).$((10#${M})).$((10#${D})).0"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="v${VERSION}-pr-${{ github.event.number }}"
            PRERELEASE="true"
          else
            TAG="v${VERSION}"
            PRERELEASE="false"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_semver=${VERSION_SEMVER}" >> $GITHUB_OUTPUT
          echo "version_msix=${VERSION_MSIX}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT
          echo "::notice::Version: ${VERSION} (semver: ${VERSION_SEMVER}, msix: ${VERSION_MSIX}) | Tag: ${TAG} | Pre-release: ${PRERELEASE}"

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Update version for Tauri
        shell: bash
        run: |
          jq --arg v "${{ needs.version.outputs.version-semver }}" '.version = $v' \
            src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

      - name: Build
        run: npx tauri build

      - name: Rename artifacts
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          SEMVER="${{ needs.version.outputs.version-semver }}"
          for dir in src-tauri/target/release/bundle/msi src-tauri/target/release/bundle/nsis; do
            [ -d "$dir" ] || continue
            for f in "$dir"/*"$SEMVER"*; do
              [ -f "$f" ] || continue
              mv "$f" "${f//$SEMVER/$VERSION}"
            done
          done

      - name: Prepare MSIX signing certificate (optional)
        shell: pwsh
        run: |
          if ($env:MSIX_PFX_B64) {
            $bytes = [Convert]::FromBase64String($env:MSIX_PFX_B64)
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\msix-sign.pfx", $bytes)
            "MSIX_SIGN_PFX_PATH=$env:RUNNER_TEMP\msix-sign.pfx" >> $env:GITHUB_ENV
          } else {
            Write-Host "No signing certificate provided: MSIX stays unsigned (Partner Center re-signs on submission)."
          }
        env:
          MSIX_PFX_B64: ${{ secrets.MSIX_SIGN_PFX_BASE64 }}

      # Paquet MSIX Desktop Bridge (Partner Center) : non signe par defaut,
      # Identity/Publisher via variables (valeurs Partner Center requises avant soumission).
      - name: Package MSIX (Microsoft Store)
        shell: pwsh
        run: ./scripts/pack-msix.ps1 -DisplayName "Vivum" -PublisherDisplayName "Vivum"
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_VERSION: ${{ needs.version.outputs.version-msix }}
          MSIX_SIGN_PASSWORD: ${{ secrets.MSIX_SIGN_PASSWORD }}

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 1

      - name: Upload NSIS
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: src-tauri/target/release/bundle/msix/*.msix
          if-no-files-found: error
          retention-days: 1

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: Install dependencies
        run: npm ci

      - name: Update version for Tauri
        run: |
          jq --arg v "${{ needs.version.outputs.version-semver }}" '.version = $v' \
            src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

      - name: Build
        run: npx tauri build

      - name: Rename artifacts
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          SEMVER="${{ needs.version.outputs.version-semver }}"
          for dir in src-tauri/target/release/bundle/deb src-tauri/target/release/bundle/rpm; do
            [ -d "$dir" ] || continue
            for f in "$dir"/*"$SEMVER"*; do
              [ -f "$f" ] || continue
              mv "$f" "${f//$SEMVER/$VERSION}"
            done
          done

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 1

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 1

  build-macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Update version for Tauri
        run: |
          jq --arg v "${{ needs.version.outputs.version-semver }}" '.version = $v' \
            src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

      - name: Build
        run: npx tauri build --target universal-apple-darwin

      - name: Rename artifacts
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          SEMVER="${{ needs.version.outputs.version-semver }}"
          DIR="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          [ -d "$DIR" ] || exit 0
          for f in "$DIR"/*"$SEMVER"*; do
            [ -f "$f" ] || continue
            mv "$f" "${f//$SEMVER/$VERSION}"
          done

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [version, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: always() && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: artifacts

      - name: Download Windows NSIS
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: artifacts

      - name: Download Windows MSIX
        uses: actions/download-artifact@v4
        with:
          name: windows-msix
          path: artifacts

      - name: Download Linux DEB
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: artifacts

      - name: Download Linux RPM
        uses: actions/download-artifact@v4
        with:
          name: linux-rpm
          path: artifacts

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          BODY=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) found = 1
            }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$BODY" ]; then
            BODY="Aucun changelog disponible pour cette version."
          fi

          # Write to file to preserve multiline content
          echo "$BODY" > /tmp/changelog_body.md

          # Section Microsoft Store : conformite des artefacts publies
          {
            echo ""
            echo "---"
            echo ""
            echo "### Microsoft Store"
            echo ""
            echo "- Paquet \`*.msix\` Microsoft Store (Desktop Bridge, version MSIX ${{ needs.version.outputs.version-msix }}) : **non signe** sauf si \`MSIX_SIGN_PFX_BASE64\` est configure — pret pour Partner Center, le Store re-signe automatiquement. Avant soumission : renseigner les variables \`MSIX_IDENTITY_NAME\` / \`MSIX_PUBLISHER\` avec les valeurs Partner Center (nom reserve + Publisher ID), puis valider avec le Kit de certification Windows (WACK)."
          } >> /tmp/changelog_body.md

      - name: Delete existing release
        run: gh release delete "${{ needs.version.outputs.tag }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "Vivum ${{ needs.version.outputs.version }}"
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          body_path: /tmp/changelog_body.md
          files: artifacts/*
